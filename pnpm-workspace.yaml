packages:
  - packages/*
  - examples/*
  - benchmarks/*

overrides:
  react: 19.2.8
  react-dom: 19.2.8
  next: 16.3.4

allowBuilds:
  esbuild: true
  sharp: true

hoistWorkspacePackages: false

linkWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild
  - sharp

saveWorkspaceProtocol: false

minimumReleaseAgeExclude:
  - globals@17.12.0
  - lucide-react@1.39.0
