name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  release:
    name: Release
    if: github.repository == 'codecarvings/r-machine'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to create release (changesets/action)
      issues: write # to post issue comments (changesets/action)
      pull-requests: write # to create pull request (changesets/action)
      id-token: write # to use OpenID Connect token for provenance (changesets/action)    

    env:
      HUSKY: 0

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup CI
        uses: ./.github/actions/ci-setup

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        # v2 is the line built on the Changesets v3 packages. v1 bundles the v2
        # reader, which mistakes `.changeset/pre/` for a legacy changeset folder
        # and fails on `pre/changes.md`. The token now defaults to `github.token`.
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Update npm dist-tags
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          npx tsx scripts/update-npm-dist-tags.ts '${{ steps.changesets.outputs.published-packages }}'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
